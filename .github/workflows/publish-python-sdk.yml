name: Publish Python SDK

on:
  # Manual only — publishing is done by hand.
  #
  # This previously ran on 'python-v*' tags and on every GitHub release.
  # The release trigger fired for all three SDK workflows on any release,
  # whether or not the package had changed, so 'twine upload' failed against
  # the already-published version. Restore those triggers here if automatic
  # publishing is wanted again; disabling in the Actions UI is not recorded
  # in the repository and does not survive a fork.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        working-directory: ./sdk/python
        run: python -m build

      - name: Publish to PyPI
        working-directory: ./sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
