name: Publish Node-RED Contrib

on:
  # Manual only — publishing is done by hand.
  #
  # This previously ran on 'node-red-v*' tags and on every GitHub release.
  # The release trigger fired for all three SDK workflows on any release,
  # whether or not the package had changed, so 'npm publish' failed against
  # the already-published version. Restore those triggers here if automatic
  # publishing is wanted again; disabling in the Actions UI is not recorded
  # in the repository and does not survive a fork.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: ./sdk/node-red-contrib
        run: npm install

      - name: Run a basic lint (optional)
        working-directory: ./sdk/node-red-contrib
        run: npm install eslint && npx eslint *.js || true

      - name: Publish to npm
        working-directory: ./sdk/node-red-contrib
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
