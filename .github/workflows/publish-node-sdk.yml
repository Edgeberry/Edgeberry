name: Publish Node SDK

on:
  # Manual only — publishing is done by hand.
  #
  # This previously ran on 'node-sdk-v*' tags and on every GitHub release.
  # The release trigger fired for all three SDK workflows on any release,
  # whether or not the package had changed, so 'npm publish' failed against
  # the already-published version. Restore those triggers here if automatic
  # publishing is wanted again; disabling in the Actions UI is not recorded
  # in the repository and does not survive a fork.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: ./sdk/node
        run: npm install

      - name: Build
        working-directory: ./sdk/node
        run: npm run build

      - name: Publish to npm
        working-directory: ./sdk/node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
