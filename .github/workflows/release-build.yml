name: Build and Package
on:
  release:
    types: [created]

# Required by softprops/action-gh-release to attach assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Must satisfy vite's engine requirement (^20.19 || >=22.12) — the web
        # UI build fails outright on older runtimes.
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build project
        # Builds the web UI into public/webui, then compiles src/ into build/.
        run: npm run build

      - name: Gather required files
        run: |
          mkdir -p tempdir/scripts tempdir/config
          # Runtime: the compiled server, the built web UI it serves, and the
          # theme/error pages nginx serves directly.
          cp -r build  tempdir/
          cp -r public tempdir/
          cp -r share  tempdir/
          # package-lock.json ships so the device installs the exact dependency
          # tree that was built and tested here.
          cp package.json package-lock.json tempdir/
          # Configuration that install.sh moves to system locations.
          cp -r config/nginx tempdir/config/
          cp config/edgeberry-core.conf       tempdir/config/
          cp config/io.edgeberry.core.service tempdir/config/
          # Scripts that stay on the device.
          cp scripts/edgeberry_cli.sh scripts/setup.sh scripts/uninstall.sh tempdir/scripts/

      - name: Verify package contents
        # The web UI was silently absent from the package before this check
        # existed. Fail the build rather than ship a device with no interface.
        run: |
          set -e
          # Whole directory trees must match the source exactly. Diffing rather
          # than listing filenames means files added to these directories are
          # covered automatically, with no list here to keep in sync.
          diff -r build          tempdir/build
          diff -r public         tempdir/public
          diff -r share          tempdir/share
          diff -r config/nginx   tempdir/config/nginx
          # Files copied individually, so they are named individually.
          for f in \
            tempdir/package.json \
            tempdir/package-lock.json \
            tempdir/config/io.edgeberry.core.service \
            tempdir/config/edgeberry-core.conf \
            tempdir/scripts/edgeberry_cli.sh \
            tempdir/scripts/setup.sh \
            tempdir/scripts/uninstall.sh
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          # The two artefacts a build can plausibly produce empty.
          test -f tempdir/build/main.js || { echo "MISSING: compiled server"; exit 1; }
          ls tempdir/public/webui/assets/*.js >/dev/null 2>&1 \
            || { echo "MISSING: web UI javascript bundle"; exit 1; }
          echo "Package contents verified."

      - name: Create tarball
        run: |
          NAME="$(echo '${{ github.repository }}' | cut -d'/' -f2)"
          ASSET="${NAME}-${{ github.event.release.tag_name }}.tar.gz"
          tar -C ./tempdir -zcf "${ASSET}" .
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Upload release assets
        # actions/upload-release-asset@v1 is archived and unmaintained.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ env.ASSET }}
            scripts/install.sh
