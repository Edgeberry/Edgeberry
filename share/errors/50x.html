<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error - Edgeberry Device</title>
<style>
/* Inlined rather than linked: this page is served when something has already
   gone wrong, so it must not depend on a second request succeeding. */
:root{
  --eb-font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --eb-bg:   #ffffff;
  --eb-fg:   #1e1e1e;
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box
}
body{
  font-family:var(--eb-font);
  background:var(--eb-fg);color:var(--eb-bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.card{
  border-radius:12px;
  width:100%;
  max-width:460px;
  text-align:center;
}
h1{
  font-size:22px;
  font-weight:700;
  margin-bottom:8px;
}
p{
  color:var(--eb-bg);
  font-size:14px;
  opacity:.6;
}
</style>
</head>
<body>
<div class="card">
  <h1>Server Error</h1>
  <p>Something went wrong. Please try again later.</p>
</div>
</body>
</html>
