<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Edgeberry</title>
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/theme/brand.css">
<link rel="icon" href="/theme/logo/symbol.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--eb-font);
  background:var(--eb-fg);color:var(--eb-bg);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.card{border:1px solid var(--eb-line);border-top:4px solid var(--eb-accent);border-radius:12px;
  width:100%;max-width:400px;padding:32px;text-align:center;}
.logo{width:140px;max-width:100%;height:auto;margin-bottom:24px;}
h1{font-size:22px;font-weight:700;margin-bottom:8px;}
p{color:var(--eb-fg);font-size:14px;opacity:.6;}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/theme/logo/logo.svg" alt="Edgeberry">
  <h1>404 — Not Found</h1>
  <p>The requested resource could not be found.</p>
</div>
</body>
</html>
